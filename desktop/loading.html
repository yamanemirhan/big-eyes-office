<!doctype html>
<html><head><meta charset="utf-8"><title>Big Eyes Office</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f6efe6; font: 15px system-ui, sans-serif; color: #2b2622; }
  @media (prefers-color-scheme: dark) { body { background: #1f1b18; color: #f1e9df; } }
  .eyes { display: flex; gap: 14px; justify-content: center; margin-bottom: 16px; }
  .eye { width: 46px; height: 54px; border-radius: 50%; background: #fff; border: 3px solid #2b2622; position: relative; animation: blink 3s infinite; }
  .eye::after { content: ''; position: absolute; width: 20px; height: 20px; border-radius: 50%; background: #2b2622; left: 13px; top: 18px; animation: look 2.4s infinite alternate; }
  @keyframes look { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  p { text-align: center; opacity: .75; }
</style></head>
<body><div><div class="eyes"><div class="eye"></div><div class="eye"></div></div><p id="msg">Starting the office…</p></div></body></html>
